<div
  class="confirm-backdrop"
  *ngIf="state() as dialog"
  (click)="onBackdropClick($event)"
>
  <div
    class="confirm-panel card"
    [class.confirm-panel--danger]="dialog.danger"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-label]="dialog.title"
  >
    <div class="confirm-icon" [class.confirm-icon--danger]="dialog.danger">
      <svg *ngIf="dialog.danger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
        <line x1="12" y1="9" x2="12" y2="13" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>
      <svg *ngIf="!dialog.danger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="13" />
        <line x1="12" y1="16.5" x2="12.01" y2="16.5" />
      </svg>
    </div>

    <h2 class="confirm-title">{{ dialog.title }}</h2>
    <p class="confirm-message">{{ dialog.message }}</p>

    <div class="confirm-actions">
      <button type="button" class="btn btn-ghost" (click)="cancel()">{{ dialog.cancelText }}</button>
      <button
        type="button"
        class="btn"
        [class.btn-danger]="dialog.danger"
        [class.btn-primary]="!dialog.danger"
        (click)="confirm()"
      >
        {{ dialog.confirmText }}
      </button>
    </div>
  </div>
</div>
