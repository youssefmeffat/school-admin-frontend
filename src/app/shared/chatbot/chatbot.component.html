<button
  type="button"
  class="chat-fab"
  [class.open]="isOpen"
  (click)="toggle()"
  [attr.aria-label]="isOpen ? 'Close assistant' : 'Open assistant'"
>
  <svg *ngIf="!isOpen" viewBox="0 0 24 24" class="fab-icon">
    <path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4.4 3.53A.6.6 0 0 1 2.6 20V6.4A2.4 2.4 0 0 1 5 4z" />
  </svg>
  <svg *ngIf="isOpen" viewBox="0 0 24 24" class="fab-icon">
    <path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z" />
  </svg>
</button>

<div class="chat-panel" *ngIf="isOpen">
  <header class="chat-header">
    <div class="chat-header-title">
      <span class="seal chat-seal">Fs</span>
      <div class="chat-header-text">
        <span class="chat-title">Flairschool Assistant</span>
        <span class="chat-subtitle">Ask about students, classes, grades &amp; exams</span>
      </div>
    </div>
    <button type="button" class="chat-close" (click)="close()" aria-label="Close assistant">
      <svg viewBox="0 0 24 24">
        <path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z" />
      </svg>
    </button>
  </header>

  <div class="chat-body">
    <div
      class="chat-message"
      [class.from-user]="msg.role === 'user'"
      *ngFor="let msg of messages"
    >
      <div class="bubble">{{ msg.text }}</div>
    </div>

    <div class="chat-message" *ngIf="isSending">
      <div class="bubble typing">
        <span></span><span></span><span></span>
      </div>
    </div>

    <p class="chat-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div #scrollAnchor></div>
  </div>

  <form class="chat-input" (ngSubmit)="send()">
    <textarea
      rows="1"
      placeholder="Type your message..."
      name="draft"
      [(ngModel)]="draft"
      (keydown)="onKeydown($event)"
    ></textarea>
    <button
      type="submit"
      class="send-btn"
      [disabled]="!draft.trim() || isSending"
      aria-label="Send message"
    >
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z" /></svg>
    </button>
  </form>
</div>
