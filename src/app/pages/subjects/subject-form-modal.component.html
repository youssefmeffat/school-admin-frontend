<app-modal [title]="title" (closed)="cancel()">
  <form class="subject-form" (ngSubmit)="submit()">
    <div class="form-row">
      <label for="subject-name">Subject name</label>
      <input
        id="subject-name"
        type="text"
        name="name"
        [(ngModel)]="name"
        (ngModelChange)="onNameChange()"
        placeholder="e.g. Mathematics"
        maxlength="25"
        [disabled]="saving"
        [class.input-error]="nameError"
        [attr.aria-invalid]="nameError ? 'true' : null"
        [attr.aria-describedby]="nameError ? 'subject-name-error' : null"
        required
      />

      <p
        id="subject-name-error"
        class="form-error field-error"
        *ngIf="nameError"
      >
        {{ nameError }}
      </p>
    </div>

    <p class="form-error" *ngIf="error">{{ error }}</p>

    <div class="form-actions">
      <button type="button" class="btn btn-ghost" (click)="cancel()" [disabled]="saving">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? 'Saving…' : (mode === 'edit' ? 'Save changes' : 'Add subject') }}
      </button>
    </div>
  </form>
</app-modal>
