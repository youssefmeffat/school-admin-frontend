<app-modal
  [title]="title"
  (closed)="cancel()"
>
  <form
    class="exam-form"
    (ngSubmit)="submit()"
  >

    <!-- EXAM NAME -->
    <div class="form-row">
      <label for="exam-name">
        Exam name
      </label>

      <input
        id="exam-name"
        name="name"
        type="text"
        [(ngModel)]="name"
        placeholder="e.g. Mathematics Exam"
        [disabled]="saving"
      />
    </div>

    <!-- GRADE -->
    <div class="form-row">
      <label for="exam-grade">
        Grade
      </label>

      <select
        id="exam-grade"
        name="gradeId"
        [(ngModel)]="gradeId"
        (ngModelChange)="onGradeChange()"
        [disabled]="
          gradesLoading || saving
        "
      >
        <option [ngValue]="null">
          {{
            gradesLoading
              ? 'Loading grades…'
              : 'Select grade'
          }}
        </option>

        <option
          *ngFor="let grade of grades"
          [ngValue]="grade.id"
        >
          {{ grade.name }}
        </option>
      </select>
    </div>

    <!-- SUBJECT -->
    <div class="form-row">
      <label for="exam-subject">
        Subject
      </label>

      <select
        id="exam-subject"
        name="subjectId"
        [(ngModel)]="subjectId"
        [disabled]="
          gradeId === null ||
          subjectsLoading ||
          saving
        "
      >
        <option [ngValue]="null">
          {{
            gradeId === null
              ? 'Select a grade first'
              : subjectsLoading
                ? 'Loading subjects…'
                : subjects.length === 0
                  ? 'No subjects available'
                  : 'Select subject'
          }}
        </option>

        <option
          *ngFor="let subject of subjects"
          [ngValue]="subject.id"
        >
          {{ subject.name }}
        </option>
      </select>

      <p
        class="form-help"
        *ngIf="
          gradeId !== null &&
          subjectsLoading
        "
      >
        Loading subjects for this grade…
      </p>

      <p
        class="form-help"
        *ngIf="
          gradeId !== null &&
          !subjectsLoading &&
          subjects.length === 0
        "
      >
        This grade has no subjects assigned.
      </p>
    </div>

    <!-- EXAM DATE -->
    <div class="form-row">
      <label for="exam-date">
        Exam date
      </label>

      <input
        id="exam-date"
        name="examDate"
        type="date"
        [(ngModel)]="examDate"
        [min]="minExamDate"
        [disabled]="saving"
      />

      <p class="form-help">
        Leave blank for an unscheduled exam.
      </p>
    </div>

    <!-- MAX SCORE -->
    <div class="form-row">
      <label for="exam-max-score">
        Max score
      </label>

      <input
        id="exam-max-score"
        name="maxScore"
        type="number"
        min="0.01"
        step="0.01"
        [(ngModel)]="maxScore"
        [disabled]="saving"
      />
    </div>

    <!-- ERROR -->
    <p
      class="form-error"
      *ngIf="error"
    >
      {{ error }}
    </p>

    <!-- ACTIONS -->
    <div class="form-actions">

      <button
        type="button"
        class="btn btn-ghost"
        (click)="cancel()"
        [disabled]="saving"
      >
        Cancel
      </button>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="
          saving ||
          subjectsLoading ||
          gradesLoading ||
          gradeId === null ||
          subjectId === null
        "
      >
        {{
          saving
            ? 'Saving…'
            : mode === 'edit'
              ? 'Save changes'
              : 'Create exam'
        }}
      </button>

    </div>

  </form>
</app-modal>
